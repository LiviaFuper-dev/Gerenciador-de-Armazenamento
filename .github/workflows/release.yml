name: Publicar versão para Windows

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Criar ambiente e instalar dependências
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Conferir versão da tag
        shell: pwsh
        run: |
          $appVersion = .\.venv\Scripts\python.exe -c "from storage_manager import __version__; print(__version__)"
          if ("v$appVersion" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} não corresponde à versão v$appVersion do aplicativo."
          }

      - name: Testar e compilar
        shell: pwsh
        run: .\build.ps1

      - name: Criar pacote ZIP
        shell: pwsh
        run: |
          $archive = "GerenciadorDeArmazenamento-${{ github.ref_name }}-windows.zip"
          Compress-Archive -Path "dist\GerenciadorDeArmazenamento.exe" -DestinationPath $archive

      - name: Publicar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "GerenciadorDeArmazenamento-${{ github.ref_name }}-windows.zip" `
            --title "Gerenciador de Armazenamento ${{ github.ref_name }}" `
            --generate-notes
